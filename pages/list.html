<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seznam projektov</title>
    <link rel="stylesheet" href="/styles/list.css">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="/src/list-projects/main.ts" defer></script>
</head>

<body>
    <div class="user-menu">
        <button class="user-button" id="user-menu-btn">
            <img src="" class="user-avatar" id="user-avatar">
            <span id="user-name">Loading...</span>
            <span class="chevron">▼</span>
        </button>
        <div class="user-dropdown" id="user-dropdown" style="display: none;">
            <button class="user-dropdown-elem" id="notifications-btn" data-bs-toggle="modal"
                data-bs-target="#notifications-modal">Notifications<svg hidden class="notification-btn-unread"
                    xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="var(--pink)"
                    class="bi bi-circle-fill" viewBox="0 0 16 16">
                    <circle cx="8" cy="8" r="4"></circle>
                </svg>
            </button>
            <button class="user-dropdown-elem" id="logout-btn">Log Out</button>
        </div>
    </div>

    <div id="loader" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <span id="status-text">Connecting to server...</span>
        <button id="retry-btn" style="display: none; margin-top: 10px;">Try Again</button>
    </div>

    <div class="project-page-layout">
        <div class="table-container">
            <table class="table table-borderless table-sm table-hover">
                <thead>
                    <tr>
                        <th><b>Project</b></th>
                        <th><b>HR Process Owner</b></th>
                        <th><b>Payroll Lead</b></th>
                        <th><b>Creation Date</b></th>
                        <th style="width: 100px;"></th>
                    </tr>
                </thead>
                <tbody class="project-list">
                </tbody>
            </table>
        </div>
        <button class="add-project-button" onclick="window.location.href='/pages/create.html'">
            Add Project
        </button>
    </div>

    <div id="notifications-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Notifications</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div id="notifications-modal-body" class="modal-body">
                </div>
                <div class="modal-footer">
                    <div class="me-auto"></div>
                    <button type="button" class="default-btn close-modal" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
